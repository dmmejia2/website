    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1c1916" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="480" rx="24" fill="url(#bg)" stroke="rgba(28,25,22,0.06)"/>
  <circle cx="200" cy="140" r="56" fill="url(#head)"/>
